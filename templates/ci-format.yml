# Proxy workflow. Copy to .github/workflows/ci-format.yml in your org's proxy
# repo and require <proxy-repo>/.github/workflows/ci-format.yml@develop in the
# org ruleset for the prototype, alpha, beta maturity tier(s).
#
# Rulesets ignore event filters on required workflows, so this file has
# no paths filter. The composite self-skips when no relevant files have changed.
# Check contexts are the job names and do not depend on this workflow's name.
# Keep the name distinct from the required workflow's: the concurrency group is
# built from the name and is scoped to the repository, so two workflows sharing
# a name would let their runs cancel each other.

name: CI

on:
  pull_request:

concurrency:
  # The literal prefix is the separation. A concurrency group is scoped to the
  # repository, not to one workflow, so without it this group would collide with
  # any other workflow that happened to share this one's name. This file is a
  # required-workflow source, so its prefix matches the other required workflows'.
  group: required-ci-format-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run format
        uses: BHoM/CI_Toolkit/.github/actions/ci-format@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
