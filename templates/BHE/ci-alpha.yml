# Alpha-tier proxy, BHE variant. Bundles the tier's checks. Copyright is
# omitted (private repos do not enforce OSS copyright); all other jobs mirror
# the BHoM variant. Copy to .github/workflows/ci-alpha.yml in each BHE alpha
# repo. Runs on pull_request, non-blocking until a ruleset requires its checks.
# Check contexts are the job names and do not depend on this workflow's name.
# Keep the name distinct from the required workflow's: the concurrency group is
# built from the name and is scoped to the repository, so two workflows sharing
# a name would let their runs cancel each other.

name: CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  # The literal prefix is the separation. A concurrency group is scoped to the
  # repository, not to one workflow, so without it this group would collide with
  # any other workflow that happened to share this one's name. The tier is in the
  # prefix so two tier files in one repository cannot collide either.
  group: local-ci-alpha-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ci-build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Run build
        uses: BHoM/CI_Toolkit/.github/actions/ci-build@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-project-compliance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Run project compliance
        uses: BHoM/CI_Toolkit/.github/actions/ci-compliance@develop
        with:
          check_type: project
          patterns: '*AssemblyInfo.cs *.csproj'
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-serialisation:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Run serialisation
        uses: BHoM/CI_Toolkit/.github/actions/ci-serialisation@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          base_ref: ${{ github.base_ref }}
