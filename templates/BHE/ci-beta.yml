# Beta-tier proxy, BHE variant. Bundles the tier's checks. Copyright is
# omitted (private repos do not enforce OSS copyright); all other jobs mirror
# the BHoM variant. Copy to .github/workflows/ci-beta.yml in each BHE beta
# repo. Runs on pull_request, non-blocking until a ruleset requires its checks.
#
# Some of these jobs may also be supplied to a repository by an organisation-level
# required workflow. Where that happens the same job runs from two places until the
# repository-local copy is reduced, so the two definitions must stay identical: a
# difference between them surfaces as two check runs of the same name disagreeing,
# which is unreadable on a pull request.
# Workflow name CI keeps check contexts bare: required contexts are the job names.

name: CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ci-build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Run build
        uses: BHoM/CI_Toolkit/.github/actions/ci-build@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-code-compliance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Run code compliance
        uses: BHoM/CI_Toolkit/.github/actions/ci-compliance@develop
        with:
          check_type: code
          patterns: '*.cs'
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-dataset-compliance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Run dataset compliance
        uses: BHoM/CI_Toolkit/.github/actions/ci-compliance@develop
        with:
          check_type: dataset
          # Versioning_Test/Datasets holds JSON Lines of oM objects, not
          # BH.oM.Data.Library.Dataset documents, so IsValidDataset errors on every
          # one of them. Measured: DatasetComplianceRunner exits 1 on 9.2/Objects.json
          # and 0 on a real library dataset. Excluded rather than teaching the runner
          # a second shape, because that would touch Test_Toolkit.
          #
          # This excludes one directory layout, not a class of file. The selector is
          # substring-based, not dataset-aware: '*' crosses '/' without :(glob), so
          # the substring can come from a filename, a data directory, or a project
          # directory named *_Datasets.
          #
          # No .ci/Datasets exclusion. Unit-test fixtures are in scope and the runner
          # reports their Confidence findings as warnings, so they are visible without
          # gating. Excluding them instead would also hide a fixture the engine cannot
          # read, which is the case that most needs to be seen.
          patterns: ':(icase)*datasets*.json :(exclude,icase)*Versioning_Test/Datasets/*'
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-documentation-compliance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Run documentation compliance
        uses: BHoM/CI_Toolkit/.github/actions/ci-compliance@develop
        with:
          check_type: documentation
          patterns: '*.cs'
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-project-compliance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Run project compliance
        uses: BHoM/CI_Toolkit/.github/actions/ci-compliance@develop
        with:
          check_type: project
          patterns: '*AssemblyInfo.cs *.csproj'
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-dataset-tests:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Run dataset tests
        uses: BHoM/CI_Toolkit/.github/actions/ci-dataset-tests@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-serialisation:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Run serialisation
        uses: BHoM/CI_Toolkit/.github/actions/ci-serialisation@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          base_ref: ${{ github.base_ref }}

  ci-versioning:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Run versioning
        uses: BHoM/CI_Toolkit/.github/actions/ci-versioning@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
